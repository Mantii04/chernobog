name: Build Chernobog
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip
      - run: |
          curl -H "Authorization: Bearer ${{ secrets.SDK_TOKEN }}" -L -o idasdk.zip https://github.com/Mantii04/ida-sdk-private/releases/download/v1.0/idasdk.zip
          unzip idasdk.zip
          mv ida95-sdk-main idasdk
      - run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build
        env:
          IDASDK: ${{ github.workspace }}/idasdk
      - uses: actions/upload-artifact@v4
        with:
          name: chernobog-plugin
          path: build/chernobog.so
