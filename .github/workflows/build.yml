name: Build Chernobog
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip
      - run: |
          unzip idasdk.zip
          mv ida-sdk-main idasdk
      - run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build
        env:
          IDASDK: ${{ github.workspace }}/idasdk/src
      - uses: actions/upload-artifact@v4
        with:
          name: chernobog-plugin
          path: build/chernobog.so
