name: Build Chernobog

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chernobog
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip

      - name: Download IDA SDK
        run: |
          curl -L -o idasdk.zip https://github.com/Mantii04/ida-sdk-private/releases/download/v1.0/idasdk.zip
          unzip idasdk.zip
          mv ida95-sdk-main idasdk

      - name: Build Chernobog
        env:
          IDASDK: ${{ github.workspace }}/idasdk
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chernobog-plugin
          path: build/chernobog.so
